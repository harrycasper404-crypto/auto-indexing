name: Indexing Booster

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-indexing-booster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run indexing booster
        run: node scripts/indexing-booster.js --sitemap https://trinityglobals.com/sitemap.xml --sitemap https://trinityglobals.com/blog/sitemap.xml/ --property sc-domain:trinityglobals.com --top 50

      - name: Generate SEO dashboard JSON
        run: node scripts/generate-seo-json.js --sitemap https://trinityglobals.com/sitemap.xml --sitemap https://trinityglobals.com/blog/sitemap.xml/ --property sc-domain:trinityglobals.com

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/data/latest.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update SEO dashboard data [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload indexing booster artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indexing-booster-output
          if-no-files-found: error
          path: |
            urls_all.txt
            urls_skipped_duplicates.txt
            urls_priority_sorted.txt
            urls_priority_top50.txt
            urls_ok.txt
            urls_bad.txt
            inspect_links_priority_top50.txt
